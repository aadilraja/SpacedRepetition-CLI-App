[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revision-tracker"
version = "0.1.0"
description = "Personal spaced-revision tracker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12,<1.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
]

[project.scripts]
revise = "main:app"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]


[tool.setuptools.packages.find]
where = ["src"]